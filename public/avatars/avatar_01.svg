<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" fill="#0d0d0d"/>
  <!-- Robot — cyan -->
  <rect x="17" y="14" width="30" height="26" rx="3" fill="#091a1a" stroke="#00d4ff" stroke-width="1.2"/>
  <!-- Visor -->
  <rect x="17" y="22" width="30" height="9" fill="#00d4ff" opacity="0.1"/>
  <!-- Eyes -->
  <rect x="21" y="24" width="8" height="5" rx="1" fill="#00d4ff" opacity="0.9"/>
  <rect x="35" y="24" width="8" height="5" rx="1" fill="#00d4ff" opacity="0.9"/>
  <rect x="23" y="25" width="4" height="3" rx="0.5" fill="#fff" opacity="0.5"/>
  <rect x="37" y="25" width="4" height="3" rx="0.5" fill="#fff" opacity="0.5"/>
  <!-- Mouth grill -->
  <rect x="22" y="34" width="20" height="1.2" rx="0.5" fill="#00d4ff" opacity="0.6"/>
  <rect x="22" y="37" width="20" height="1.2" rx="0.5" fill="#00d4ff" opacity="0.3"/>
  <!-- Ear panels -->
  <rect x="12" y="23" width="5" height="5" rx="1" fill="#00d4ff" opacity="0.35"/>
  <rect x="47" y="23" width="5" height="5" rx="1" fill="#00d4ff" opacity="0.35"/>
  <!-- Antenna -->
  <line x1="32" y1="14" x2="32" y2="7" stroke="#00d4ff" stroke-width="1.2" opacity="0.8"/>
  <circle cx="32" cy="5.5" r="2" fill="#00d4ff"/>
  <!-- Neck -->
  <rect x="27" y="40" width="10" height="7" rx="1" fill="#091a1a" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
  <!-- Circuit lines on forehead -->
  <line x1="20" y1="18" x2="26" y2="18" stroke="#00d4ff" stroke-width="0.6" opacity="0.4"/>
  <line x1="38" y1="18" x2="44" y2="18" stroke="#00d4ff" stroke-width="0.6" opacity="0.4"/>
  <circle cx="26" cy="18" r="1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="38" cy="18" r="1" fill="#00d4ff" opacity="0.5"/>
</svg>
