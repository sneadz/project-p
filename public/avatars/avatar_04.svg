  <ellipse cx="32" cy="22" rx="17" ry="16" stroke="#22c55e" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- Cap brim -->
  <path d="M15 28 Q32 33 49 28" stroke="#22c55e" stroke-width="1.2" fill="none"/>
  <!-- Face area -->
  <rect x="20" y="28" width="24" height="12" rx="2" fill="#0a1a0a"/>
  <!-- Terminal eyes -->
  <rect x="22" y="30" width="8" height="5" rx="1" fill="#22c55e" opacity="0.15"/>
  <rect x="34" y="30" width="8" height="5" rx="1" fill="#22c55e" opacity="0.15"/>
  <rect x="23" y="31" width="2" height="3" rx="0.3" fill="#22c55e" opacity="0.9"/>
  <rect x="26" y="31" width="3" height="3" rx="0.3" fill="#22c55e" opacity="0.6"/>
  <rect x="35" y="31" width="3" height="3" rx="0.3" fill="#22c55e" opacity="0.6"/>
  <rect x="39" y="31" width="2" height="3" rx="0.3" fill="#22c55e" opacity="0.9"/>
  <!-- Code on forehead -->
  <rect x="22" y="16" width="6" height="2" rx="0.5" fill="#22c55e" opacity="0.35"/>
  <rect x="30" y="14" width="8" height="2" rx="0.5" fill="#22c55e" opacity="0.25"/>
  <rect x="40" y="16" width="4" height="2" rx="0.5" fill="#22c55e" opacity="0.35"/>
