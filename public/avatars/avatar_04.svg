  <rect x="22" y="38" width="20" height="1.5" rx="0.5" fill="#22c55e" opacity="0.5"/>
  <rect x="22" y="38" width="7" height="1.5" rx="0.5" fill="#22c55e" opacity="0.9"/>
  <!-- Neck -->
  <rect x="27" y="42" width="10" height="6" rx="1" fill="#0a1a0a" stroke="#22c55e" stroke-width="0.8" opacity="0.5"/>
  <!-- Side dots -->
  <circle cx="14" cy="26" r="1.5" fill="#22c55e" opacity="0.6"/>
  <circle cx="50" cy="26" r="1.5" fill="#22c55e" opacity="0.6"/>
