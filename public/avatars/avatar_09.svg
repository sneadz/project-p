<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" fill="#0d0d0d"/>
  <!-- skull top -->
  <rect x="20" y="10" width="24" height="4" fill="#e8e8e8"/>
  <rect x="16" y="14" width="32" height="20" fill="#e8e8e8"/>
  <rect x="14" y="18" width="2" height="12" fill="#e8e8e8"/>
  <rect x="48" y="18" width="2" height="12" fill="#e8e8e8"/>
  <!-- cheeks -->
  <rect x="14" y="28" width="8" height="4" fill="#e8e8e8"/>
  <rect x="42" y="28" width="8" height="4" fill="#e8e8e8"/>
  <!-- eye sockets -->
  <rect x="20" y="20" width="8" height="8" fill="#0d0d0d"/>
  <rect x="36" y="20" width="8" height="8" fill="#0d0d0d"/>
  <!-- eye glow red -->
  <rect x="21" y="21" width="6" height="6" fill="#cc0000" opacity="0.8"/>
  <rect x="37" y="21" width="6" height="6" fill="#cc0000" opacity="0.8"/>
  <!-- nose -->
  <rect x="30" y="28" width="4" height="4" fill="#0d0d0d"/>
  <!-- jaw -->
  <rect x="20" y="34" width="24" height="2" fill="#e8e8e8"/>
  <rect x="20" y="36" width="4" height="8" fill="#e8e8e8"/>
  <rect x="26" y="36" width="4" height="8" fill="#e8e8e8"/>
  <rect x="34" y="36" width="4" height="8" fill="#e8e8e8"/>
  <rect x="40" y="36" width="4" height="8" fill="#e8e8e8"/>
  <!-- tooth gaps -->
  <rect x="24" y="36" width="2" height="8" fill="#0d0d0d"/>
  <rect x="30" y="36" width="4" height="8" fill="#0d0d0d"/>
  <rect x="38" y="36" width="2" height="8" fill="#0d0d0d"/>
</svg>
