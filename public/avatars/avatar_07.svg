<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" fill="#0d0d0d"/>
  <!-- Fox/Cat — pink -->
  <!-- Ears -->
  <path d="M18 22 L14 8 L26 18 Z" fill="#ec4899" opacity="0.8"/>
  <path d="M46 22 L50 8 L38 18 Z" fill="#ec4899" opacity="0.8"/>
  <!-- Inner ear -->
  <path d="M19 20 L15.5 10 L24 17 Z" fill="#f9a8d4" opacity="0.5"/>
  <path d="M45 20 L48.5 10 L40 17 Z" fill="#f9a8d4" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="32" cy="30" rx="16" ry="15" fill="#1a0510"/>
  <ellipse cx="32" cy="30" rx="16" ry="15" stroke="#ec4899" stroke-width="1.2" fill="none"/>
  <!-- Eyes — large, rounded -->
  <ellipse cx="25" cy="28" rx="5" ry="4.5" fill="#ec4899" opacity="0.15"/>
  <ellipse cx="39" cy="28" rx="5" ry="4.5" fill="#ec4899" opacity="0.15"/>
  <ellipse cx="25" cy="28" rx="4" ry="3.5" stroke="#ec4899" stroke-width="0.8" fill="none" opacity="0.7"/>
  <ellipse cx="39" cy="28" rx="4" ry="3.5" stroke="#ec4899" stroke-width="0.8" fill="none" opacity="0.7"/>
  <!-- Pupils -->
  <ellipse cx="25" cy="28" rx="2" ry="3" fill="#ec4899" opacity="0.9"/>
  <ellipse cx="39" cy="28" rx="2" ry="3" fill="#ec4899" opacity="0.9"/>
  <!-- Eye shine -->
  <circle cx="26" cy="26.5" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="40" cy="26.5" r="1" fill="#fff" opacity="0.6"/>
  <!-- Nose -->
  <ellipse cx="32" cy="34" rx="2" ry="1.5" fill="#ec4899" opacity="0.8"/>
  <!-- Whiskers -->
  <line x1="20" y1="35" x2="30" y2="34.5" stroke="#ec4899" stroke-width="0.7" opacity="0.5"/>
  <line x1="20" y1="37" x2="30" y2="36" stroke="#ec4899" stroke-width="0.7" opacity="0.4"/>
  <line x1="44" y1="35" x2="34" y2="34.5" stroke="#ec4899" stroke-width="0.7" opacity="0.5"/>
  <line x1="44" y1="37" x2="34" y2="36" stroke="#ec4899" stroke-width="0.7" opacity="0.4"/>
  <!-- Mouth -->
  <path d="M30 35.5 Q32 37.5 34 35.5" stroke="#ec4899" stroke-width="0.8" fill="none"/>
  <!-- Neck -->
  <rect x="27" y="45" width="10" height="6" rx="1" fill="#1a0510" stroke="#ec4899" stroke-width="0.8" opacity="0.5"/>
</svg>
