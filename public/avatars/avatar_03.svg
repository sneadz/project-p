<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" fill="#0d0d0d"/>
  <!-- Viking — orange -->
  <!-- Helmet -->
  <ellipse cx="32" cy="20" rx="15" ry="13" fill="#1a0e00" stroke="#f97316" stroke-width="1.2"/>
  <!-- Helmet top ridge -->
  <rect x="28" y="7" width="8" height="4" rx="1" fill="#f97316" opacity="0.8"/>
  <!-- Horns -->
  <path d="M17 18 Q10 10 12 4 Q16 10 18 18" fill="#f97316" opacity="0.7"/>
  <path d="M47 18 Q54 10 52 4 Q48 10 46 18" fill="#f97316" opacity="0.7"/>
  <!-- Horn outline -->
  <path d="M17 18 Q10 10 12 4 Q16 10 18 18" stroke="#f97316" stroke-width="0.8" fill="none"/>
  <path d="M47 18 Q54 10 52 4 Q48 10 46 18" stroke="#f97316" stroke-width="0.8" fill="none"/>
  <!-- Face area -->
  <ellipse cx="32" cy="26" rx="11" ry="10" fill="#1a0e00"/>
  <!-- Eyes -->
  <ellipse cx="27" cy="24" rx="3" ry="2.5" fill="#f97316" opacity="0.9"/>
  <ellipse cx="37" cy="24" rx="3" ry="2.5" fill="#f97316" opacity="0.9"/>
  <ellipse cx="27" cy="24" rx="1.5" ry="1.5" fill="#fff" opacity="0.4"/>
  <ellipse cx="37" cy="24" rx="1.5" ry="1.5" fill="#fff" opacity="0.4"/>
  <!-- Nose bridge -->
  <line x1="32" y1="26" x2="32" y2="29" stroke="#f97316" stroke-width="0.8" opacity="0.4"/>
  <!-- Beard -->
  <path d="M22 32 Q24 40 32 42 Q40 40 42 32" fill="#f97316" opacity="0.25"/>
  <path d="M22 32 Q24 40 32 42 Q40 40 42 32" stroke="#f97316" stroke-width="0.8" fill="none" opacity="0.6"/>
  <!-- Beard lines -->
  <line x1="28" y1="34" x2="27" y2="40" stroke="#f97316" stroke-width="0.6" opacity="0.4"/>
  <line x1="32" y1="35" x2="32" y2="41" stroke="#f97316" stroke-width="0.6" opacity="0.4"/>
  <line x1="36" y1="34" x2="37" y2="40" stroke="#f97316" stroke-width="0.6" opacity="0.4"/>
  <!-- Neck/shoulders -->
  <rect x="27" y="42" width="10" height="6" rx="1" fill="#1a0e00" stroke="#f97316" stroke-width="0.8" opacity="0.5"/>
</svg>
