<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" fill="#0d0d0d"/>
  <!-- Ninja/Assassin — purple -->
  <!-- Hood shape -->
  <ellipse cx="32" cy="24" rx="16" ry="18" fill="#0f0a1a"/>
  <ellipse cx="32" cy="24" rx="16" ry="18" stroke="#a855f7" stroke-width="1.2" fill="none"/>
  <!-- Hood top shadow -->
  <ellipse cx="32" cy="14" rx="14" ry="7" fill="#0d0d0d" opacity="0.9"/>
  <path d="M18 16 Q32 8 46 16" stroke="#a855f7" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- Eyes only visible in shadow -->
  <rect x="22" y="26" width="7" height="3.5" rx="1" fill="#a855f7" opacity="0.95"/>
  <rect x="35" y="26" width="7" height="3.5" rx="1" fill="#a855f7" opacity="0.95"/>
  <!-- Eye glint -->
  <rect x="24" y="26.5" width="3" height="2" rx="0.5" fill="#d8b4fe" opacity="0.7"/>
  <rect x="37" y="26.5" width="3" height="2" rx="0.5" fill="#d8b4fe" opacity="0.7"/>
  <!-- Mask lower half -->
  <rect x="20" y="31" width="24" height="8" rx="2" fill="#1a0d2e"/>
  <rect x="20" y="31" width="24" height="8" rx="2" stroke="#a855f7" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- Mask texture lines -->
  <line x1="26" y1="33" x2="26" y2="37" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>
  <line x1="32" y1="33" x2="32" y2="37" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>
  <line x1="38" y1="33" x2="38" y2="37" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>
  <!-- Shoulders -->
  <path d="M14 56 Q14 44 32 44 Q50 44 50 56" stroke="#a855f7" stroke-width="1" fill="#0f0a1a" opacity="0.7"/>
  <!-- Collar -->
  <rect x="26" y="40" width="12" height="5" rx="1" fill="#1a0d2e" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>
</svg>
