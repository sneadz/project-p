<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" fill="#0d0d0d"/>
  <!-- Knight/Armor — blue -->
  <!-- Helmet -->
  <rect x="18" y="10" width="28" height="30" rx="4" fill="#050a1a" stroke="#3b82f6" stroke-width="1.2"/>
  <!-- Helmet dome -->
  <ellipse cx="32" cy="10" rx="14" ry="5" fill="#050a1a" stroke="#3b82f6" stroke-width="1.2"/>
  <!-- Visor slit -->
  <rect x="18" y="24" width="28" height="7" fill="#3b82f6" opacity="0.08"/>
  <rect x="22" y="25" width="20" height="5" rx="1" fill="none" stroke="#3b82f6" stroke-width="0.8" opacity="0.6"/>
  <!-- Eye slits in visor -->
  <rect x="23" y="26.5" width="7" height="2" rx="0.5" fill="#3b82f6" opacity="0.9"/>
  <rect x="34" y="26.5" width="7" height="2" rx="0.5" fill="#3b82f6" opacity="0.9"/>
  <!-- Chin guard -->
  <rect x="22" y="34" width="20" height="5" rx="1" fill="#050a1a" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
  <!-- Chin line -->
  <line x1="22" y1="36.5" x2="42" y2="36.5" stroke="#3b82f6" stroke-width="0.5" opacity="0.4"/>
  <!-- Side cheek guards -->
  <rect x="12" y="22" width="6" height="12" rx="2" fill="#050a1a" stroke="#3b82f6" stroke-width="0.8" opacity="0.6"/>
  <rect x="46" y="22" width="6" height="12" rx="2" fill="#050a1a" stroke="#3b82f6" stroke-width="0.8" opacity="0.6"/>
  <!-- Crest on top -->
  <rect x="29" y="5" width="6" height="5" rx="1" fill="#3b82f6" opacity="0.7"/>
  <!-- Neck guard -->
  <rect x="25" y="40" width="14" height="8" rx="2" fill="#050a1a" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
  <!-- Neck lines -->
  <line x1="25" y1="43" x2="39" y2="43" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
  <line x1="25" y1="46" x2="39" y2="46" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
</svg>
