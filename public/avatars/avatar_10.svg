<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" fill="#0d0d0d"/>
  <!-- head outline -->
  <ellipse cx="32" cy="28" rx="16" ry="18" stroke="#a855f7" stroke-width="1.5" fill="#0f0a1a"/>
  <!-- center axis -->
  <line x1="32" y1="10" x2="32" y2="46" stroke="#06b6d4" stroke-width="0.5" opacity="0.4"/>
  <!-- left eye -->
  <ellipse cx="25" cy="26" rx="4" ry="2.5" fill="#a855f7" opacity="0.9"/>
  <ellipse cx="25" cy="26" rx="2" ry="1.5" fill="#ec4899"/>
  <!-- right eye -->
  <ellipse cx="39" cy="26" rx="4" ry="2.5" fill="#a855f7" opacity="0.9"/>
  <ellipse cx="39" cy="26" rx="2" ry="1.5" fill="#ec4899"/>
  <!-- nose -->
  <path d="M32 30 L30 34 L34 34" stroke="#06b6d4" stroke-width="1" fill="none"/>
  <!-- mouth -->
  <path d="M26 38 Q32 42 38 38" stroke="#a855f7" stroke-width="1.5" fill="none"/>
  <!-- side glow lines -->
  <line x1="16" y1="20" x2="10" y2="18" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>
  <line x1="16" y1="28" x2="10" y2="28" stroke="#06b6d4" stroke-width="0.8" opacity="0.6"/>
  <line x1="48" y1="20" x2="54" y2="18" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>
  <line x1="48" y1="28" x2="54" y2="28" stroke="#06b6d4" stroke-width="0.8" opacity="0.6"/>
  <!-- neck -->
  <rect x="28" y="46" width="8" height="8" fill="none" stroke="#a855f7" stroke-width="1" rx="1"/>
  <!-- collar circuits -->
  <line x1="28" y1="50" x2="20" y2="50" stroke="#06b6d4" stroke-width="0.8" opacity="0.5"/>
  <line x1="36" y1="50" x2="44" y2="50" stroke="#06b6d4" stroke-width="0.8" opacity="0.5"/>
  <circle cx="20" cy="50" r="1.5" fill="#ec4899"/>
  <circle cx="44" cy="50" r="1.5" fill="#ec4899"/>
</svg>
